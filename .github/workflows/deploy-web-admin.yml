name: Deploy frozen farm voice release to IONOS
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: Enter farm-voice-v1-20261018-rc2
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: micro-farm-app-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RELEASE: farm-voice-v1-20261018-rc2
      ARCHIVE_SHA256: ede28c15cc5a4e339cd0344d4dfe7993f523d318aea5529a856c9e0b4b547e53
      SCRIPT_SHA256: 2ffba1d2ed1c2ed2156fec8106ec26a8d0156ee5e2dd2a527c2b8dae0e66ae38
      BACKEND_READY_RELEASE: ${{ vars.FARM_VOICE_BACKEND_READY_RELEASE }}
      CONFIRMED_RELEASE: ${{ inputs.release_confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen release and hosted backend qualification gate
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMED_RELEASE" = "$RELEASE"
          test "$BACKEND_READY_RELEASE" = "$RELEASE"
          folder=".github/deployment/releases/$RELEASE"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$folder/payload.tar.gz" | sha256sum -c -
          printf '%s  %s\n' "$SCRIPT_SHA256" "$folder/deploy.sh" | sha256sum -c -
          bash -n "$folder/deploy.sh"
      - name: Upload frozen package into private home staging
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USERNAME }}
          password: ${{ secrets.IONOS_PASSWORD }}
          port: 2222
          source: .github/deployment/releases/farm-voice-v1-20261018-rc2/payload.tar.gz,.github/deployment/releases/farm-voice-v1-20261018-rc2/deploy.sh
          target: .sproutify-incoming/farm-voice-v1-20261018-rc2
          strip_components: 4
          rm: false
          overwrite: true
      - name: Back up existing admin and publish assets before index
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USERNAME }}
          password: ${{ secrets.IONOS_PASSWORD }}
          port: 2222
          command_timeout: 5m
          script: |
            set -eu
            incoming="$HOME/.sproutify-incoming/farm-voice-v1-20261018-rc2"
            printf '%s  %s\n' '2ffba1d2ed1c2ed2156fec8106ec26a8d0156ee5e2dd2a527c2b8dae0e66ae38' "$incoming/deploy.sh" | sha256sum -c -
            target=/var/www/vhosts/sweetwaterurbanfarms.com/micro.sproutify.app/httpdocs/admin
            test -z "$(find -P "$target" -type f -links +1 -print -quit)"
            bash "$incoming/deploy.sh" "$incoming/payload.tar.gz" 'ede28c15cc5a4e339cd0344d4dfe7993f523d318aea5529a856c9e0b4b547e53' 'farm-voice-v1-20261018-rc2'
            served=$(curl --fail --silent --show-error --max-time 20 https://micro.sproutify.app/admin/index.html | sha256sum | cut -d' ' -f1)
            test "$served" = 'a7652f7d6e90de705f6edd1789e90dd010c5a45f7e67348d50426720cd89fa3c'
            today=$(curl --fail --silent --show-error --max-time 20 https://micro.sproutify.app/admin/today | sha256sum | cut -d' ' -f1)
            test "$today" = "$served"
            growing=$(curl --fail --silent --show-error --max-time 20 https://micro.sproutify.app/admin/growing | sha256sum | cut -d' ' -f1)
            test "$growing" = "$served"
            echo 'Served index, Today and Growing match the frozen release.'
