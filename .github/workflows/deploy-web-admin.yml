name: Deploy approved founding grower homepage
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: Enter farm-catalogue-v1-20261019-rc5
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: micro-farm-app-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RELEASE: farm-catalogue-v1-20261019-rc5
      ARCHIVE_SHA256: 8e65116511c137ba66c4a09027a5f3fec09edf1ac6c9fe463c13ddab7860b33a
      SCRIPT_SHA256: 13a7bb8a6f42201fb6dcd252a3677b33763e4767a7fa23f6a3f9dccb517f08c8
      BACKEND_READY_RELEASE: ${{ vars.MICRO_CONSENT_BACKEND_READY_RELEASE }}
      CONFIRMED_RELEASE: ${{ inputs.release_confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen homepage and existing qualified consent backend
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMED_RELEASE" = "$RELEASE"
          test "$BACKEND_READY_RELEASE" = "farm-catalogue-v1-20261019-rc4"
          folder=".github/deployment/releases/$RELEASE"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$folder/payload.tar.gz" | sha256sum -c -
          printf '%s  %s\n' "$SCRIPT_SHA256" "$folder/deploy.sh" | sha256sum -c -
          bash -n "$folder/deploy.sh"
      - name: Upload frozen package to private staging
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USERNAME }}
          password: ${{ secrets.IONOS_PASSWORD }}
          port: 2222
          source: .github/deployment/releases/farm-catalogue-v1-20261019-rc5/payload.tar.gz,.github/deployment/releases/farm-catalogue-v1-20261019-rc5/deploy.sh
          target: .sproutify-incoming/farm-catalogue-v1-20261019-rc5
          strip_components: 4
          rm: false
          overwrite: true
      - name: Back up and publish homepage; preserve deployed app bytes
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USERNAME }}
          password: ${{ secrets.IONOS_PASSWORD }}
          port: 2222
          command_timeout: 5m
          script: |
            set -eu
            incoming="$HOME/.sproutify-incoming/farm-catalogue-v1-20261019-rc5"
            printf '%s  %s\n' '13a7bb8a6f42201fb6dcd252a3677b33763e4767a7fa23f6a3f9dccb517f08c8' "$incoming/deploy.sh" | sha256sum -c -
            bash "$incoming/deploy.sh" "$incoming/payload.tar.gz" '8e65116511c137ba66c4a09027a5f3fec09edf1ac6c9fe463c13ddab7860b33a' 'farm-catalogue-v1-20261019-rc5' 'd516e8749199896a8554bd9377fceaa6fa37e56a5b0857f534cd9d39c346e9ce' 'ebaefc681fbb537c1b7542231d9bf3a34bd9c58e2e6c992f8e8a43fa99965717'
            for route in admin/index.html admin/today admin/growing; do
              served=$(curl --fail --silent --show-error --max-time 20 "https://micro.sproutify.app/$route")
              printf '%s' "$served" | grep -Fq '/admin/assets/index-BgCVqoHY.js'
            done
            for route in index.html pre-launch; do
              served=$(curl --fail --silent --show-error --max-time 20 "https://micro.sproutify.app/$route")
              printf '%s' "$served" | grep -Fq '/assets/index-pm0DlGvD.js'
            done
            echo 'Hosted app routes and homepage match the frozen release.'
